[project]
name = "cube-simulator"
version = "0.2.0"
description = "Mechanistic interpretability of a small transformer trained on 2x2x2 Rubik's Cube optimal-distance classification — linear probing, activation patching, tuned lens, sparse autoencoders, BFS optimal solver, and interactive 3D visualizer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "transformer-lens>=1.19.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.0.0",
    "kaleido>=1.2.0",
    "anthropic>=0.96.0",
]

[project.scripts]
cube-tests = "cube:run_tests"
cube-visualizer = "cube_visualizer:main"
cube-dataset = "dataset:main"
cube-train = "train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"cube.py" = "cube.py"
"cube_visualizer.py" = "cube_visualizer.py"
"dataset.py" = "dataset.py"
"model.py" = "model.py"
"train.py" = "train.py"
"analysis/__init__.py" = "analysis/__init__.py"
"analysis/probe.py" = "analysis/probe.py"
"analysis/patch.py" = "analysis/patch.py"
"analysis/tuned_lens.py" = "analysis/tuned_lens.py"
"analysis/sae.py" = "analysis/sae.py"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]

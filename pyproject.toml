[project]
name = "cube-simulator"
version = "0.1.0"
description = "2x2x2 Rubik's Cube simulator with one-hot state encoding"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "transformer-lens>=1.19.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.0.0",
]

[project.scripts]
cube-tests = "cube:run_tests"
cube-visualizer = "cube_visualizer:main"
cube-dataset = "dataset:main"
cube-train = "train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "cube.py",
    "cube_visualizer.py",
]

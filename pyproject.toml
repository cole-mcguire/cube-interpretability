[project]
name = "cube-simulator"
version = "0.2.0"
description = "Mechanistic interpretability of a small transformer trained on 2x2x2 Rubik's Cube optimal-distance classification — linear probing, activation patching, tuned lens, sparse autoencoders, BFS optimal solver, and interactive 3D visualizer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "transformer-lens>=1.19.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.0.0",
    "kaleido>=1.2.0",
    "anthropic>=0.96.0",
    "groq>=0.11.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "onnxscript>=0.7.0",
    "onnx>=1.21.0",
    "matplotlib>=3.10.9",
]

[project.scripts]
cube-tests = "cube:run_tests"
cube-visualizer = "cube_visualizer:main"
cube-dataset = "dataset:main"
cube-train = "train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"cube.py" = "cube.py"
"cube_visualizer.py" = "cube_visualizer.py"
"dataset.py" = "dataset.py"
"model.py" = "model.py"
"train.py" = "train.py"
"interp/__init__.py" = "interp/__init__.py"
"interp/probe.py" = "interp/probe.py"
"interp/patch.py" = "interp/patch.py"
"interp/tuned_lens.py" = "interp/tuned_lens.py"
"interp/sae.py" = "interp/sae.py"
[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]

[project]
name = "cube-simulator"
version = "0.1.0"
description = "Mechanistic interpretability of a small transformer trained on 2x2x2 Rubik's Cube optimal-distance classification — linear probing, activation patching, tuned lens, sparse autoencoders, and BFS optimal solver"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "transformer-lens>=1.19.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.0.0",
    "kaleido>=1.2.0",
]

[project.scripts]
cube-tests = "cube:run_tests"
cube-visualizer = "cube_visualizer:main"
cube-dataset = "dataset:main"
cube-train = "train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "cube.py",
    "cube_visualizer.py",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]

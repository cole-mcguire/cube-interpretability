  }

  function patch() {
    var plots = document.querySelectorAll('.js-plotly-plot');
    if (!plots.length) { setTimeout(patch, 150); return; }
    plots.forEach(patchEl);
  }

  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', patch); }
  else { patch(); }
})();
</script>
</body>
</html>
